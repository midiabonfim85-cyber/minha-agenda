<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Agenda</title><link rel="stylesheet" href="style.css"></head><body>
<section id="login" class="auth"><div class="card"><b>MINHA AGENDA</b><h1 id="at">Entrar</h1><p id="as">Acesse sua agenda de qualquer computador ou celular.</p>
<form id="lf"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="pass" type="password" required></label><button class="primary">Entrar</button></form>
<button id="forgot" class="link">Esqueci minha senha</button><button id="new" class="link">Ainda não tenho conta</button>
<form id="sf" class="hide"><label>E-mail<input id="se" type="email" required></label><label>Senha<input id="sp" type="password" minlength="6" required></label><label>Repetir senha<input id="sp2" type="password" minlength="6" required></label><button class="primary">Criar conta</button><button type="button" id="back1" class="link">Voltar</button></form>
<form id="rf" class="hide"><label>E-mail<input id="re" type="email" required></label><button class="primary">Enviar recuperação</button><button type="button" id="back2" class="link">Voltar</button></form>
<form id="pf" class="hide"><label>Nova senha<input id="np" type="password" minlength="6" required></label><label>Repetir senha<input id="np2" type="password" minlength="6" required></label><button class="primary">Salvar nova senha</button></form>
<div id="msg"></div></div></section>
<section id="app" class="hide"><header><div><small>AGENDA</small><h1>Minha Agenda</h1></div><div><span id="ue"></span> <button id="out">Sair</button> <button id="add" class="primary">+ Novo compromisso</button></div></header><main><div class="toolbar"><div><button id="prev">‹</button><button id="today">Hoje</button><button id="next">›</button><h2 id="title"></h2></div><div><button class="view active" data-v="month">Mês</button><button class="view" data-v="week">Semana</button></div></div><div id="cal"></div><h2>Próximos compromissos</h2><div id="up" class="cards"></div></main></section>
<div id="modal" class="modal hide"><div class="card"><button id="close" class="x">×</button><h2>Compromisso</h2><form id="ef"><input type="hidden" id="eid"><label>Título<input id="et" required></label><div class="grid"><label>Data<input id="ed" type="date" required></label><label>Categoria<select id="ec"><option>Trabalho</option><option>Pessoal</option><option>Saúde</option><option>Estudo</option><option>Outro</option></select></label></div><div class="grid"><label>Início<input id="es" type="time" required></label><label>Fim<input id="ee" type="time"></label></div><label>Lembrete<select id="er"><option value="0">Sem lembrete</option><option value="15" selected>15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option></select></label><label>Descrição<textarea id="ex"></textarea></label><button class="primary">Salvar</button><button type="button" id="del">Excluir</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
