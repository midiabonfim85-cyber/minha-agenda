<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Agenda</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="auth" class="auth"><div class="auth-card"><b>MINHA AGENDA</b><h1>Entrar</h1><p>Acesse sua agenda de qualquer computador ou celular.</p><form id="loginForm"><label>E-mail<input id="email" type="email" required></label><label>Senha<input id="password" type="password" required></label><button class="primary">Entrar</button><p id="loginMsg"></p></form></div></div>
<div id="app" class="hidden"><header><div><small>AGENDA</small><h1>Minha Agenda</h1></div><div><span id="userEmail"></span> <button id="logout">Sair</button> <button id="addBtn" class="primary">+ Novo compromisso</button></div></header>
<main><div class="toolbar"><div><button id="prevBtn">‹</button><button id="todayBtn">Hoje</button><button id="nextBtn">›</button><h2 id="periodTitle"></h2></div><div><button class="view active" data-view="month">Mês</button><button class="view" data-view="week">Semana</button></div></div><section id="calendar"></section><h2>Próximos compromissos</h2><div id="upcoming" class="cards"></div></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="x">×</button><h2 id="modalTitle">Novo compromisso</h2><form id="eventForm"><input type="hidden" id="eventId"><label>Título<input id="title" required></label><div class="grid"><label>Data<input id="date" type="date" required></label><label>Categoria<select id="category"><option>Trabalho</option><option>Pessoal</option><option>Saúde</option><option>Estudo</option><option>Outro</option></select></label></div><div class="grid"><label>Início<input id="start" type="time" required></label><label>Fim<input id="end" type="time"></label></div><label>Lembrete<select id="reminder"><option value="0">Sem lembrete</option><option value="5">5 minutos antes</option><option value="15" selected>15 minutos antes</option><option value="30">30 minutos antes</option><option value="60">1 hora antes</option><option value="1440">1 dia antes</option></select></label><label>Recorrência<select id="repeat"><option value="none">Não repetir</option><option value="daily">Diariamente</option><option value="weekly">Semanalmente</option><option value="monthly">Mensalmente</option></select></label><label>Descrição<textarea id="description"></textarea></label><div class="actions"><button type="button" id="deleteBtn" class="danger hidden">Excluir</button><span><button type="button" id="cancelBtn">Cancelar</button> <button class="primary">Salvar</button></span></div><p id="saveMsg"></p></form></div></div><script src="app.js"></script></body></html>
